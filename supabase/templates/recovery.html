<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#F5F8F6;font-family:Arial,Helvetica,sans-serif;color:#1F2A2E">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #E3ECE7;border-radius:18px;overflow:hidden">
            <tr>
              <td style="height:6px;font-size:0;line-height:0;background:linear-gradient(90deg,#FFD400 0 25%,#F7941D 25% 50%,#E6007E 50% 75%,#8FD5B4 75%)">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 12px;font-size:22px">Criar nova senha</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#55636A">
                  Recebemos um pedido para redefinir a senha do sistema Orto Fortino. O link vale por 1 hora.
                </p>
                <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery"
                   style="display:inline-block;background:#1F7A5C;color:#ffffff;text-decoration:none;font-weight:bold;padding:14px 24px;border-radius:12px">
                  Criar nova senha
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#55636A">
                  Se você não pediu, ignore este e-mail. Sua senha continua a mesma.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#55636A">Orto Fortino · Órteses Funcionais</p>
        </td>
      </tr>
    </table>
  </body>
</html>
